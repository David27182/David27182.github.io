<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홀덤 토너먼트</title>
<meta name="description" content="링크만 보내면 친구들과 바로 하는 노리밋 텍사스 홀덤 토너먼트. 빅 블라인드 앤티, 마지막 한 명까지.">
<meta property="og:title" content="홀덤 토너먼트">
<meta property="og:description" content="링크로 들어와서 같이 해요 — 노리밋 텍사스 홀덤, 빅 블라인드 앤티, 마지막 한 명까지.">
<meta name="theme-color" content="#0b110e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b110e; --panel: #131d19; --panel2: #1a2721; --sunk: #0d1512;
  --ink: #eeeadf; --ink2: #b5beb7; --ink3: #7f8b84; --line: rgba(238, 234, 223, .12);
  --felt0: #2d7d5e; --felt1: #1e5f47; --felt2: #103828; --rail: #3d2819; --rail2: #20140c;
  --gold: #e6c068; --jade: #47b98e; --amber: #e9a23b; --alarm: #e5533d;
  --card: #fbf8f1; --cink: #1c1c1c; --red: #c92f29; --blue: #2a62c6; --green: #1d8a52;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --col: clamp(204px, 28vw, 340px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
body { overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------------- layout: top bar / table / my dock; players on a sideways screen get a control column */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
#top { grid-row: 1; grid-column: 1; min-width: 0; }
#stage { grid-row: 2; grid-column: 1; position: relative; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr);
  background: radial-gradient(ellipse at 50% 45%, #14211b 0%, var(--bg) 72%); }
#dock { grid-row: 3; grid-column: 1; }
#table, .tbl { position: relative; min-height: 0; overflow: hidden; container-type: size;
  --sw: clamp(86px, 25cqmin, 224px); --ph: clamp(34px, 10cqmin, 82px); --cw: clamp(24px, 7.6cqmin, 62px); --ch: clamp(34px, 10.6cqmin, 87px); }
#table.narrow, .tbl.narrow { --sw: clamp(74px, 22cqmin, 200px); --ph: clamp(31px, 9.2cqmin, 76px); --cw: clamp(22px, 7cqmin, 58px); --ch: clamp(31px, 9.8cqmin, 81px); }
#feed { display: none; }
body.is-dealer.scr-table #stage { grid-template-columns: minmax(0, 1fr) minmax(250px, 23vw); }
body.is-dealer.scr-table #feed { display: block; }
@media (max-aspect-ratio: 1/1) {
  body.is-dealer.scr-table #stage { grid-template-columns: minmax(0, 1fr); }
  body.is-dealer.scr-table #feed { display: none; }
}
body.is-player.scr-table.lay-land #app { grid-template-rows: minmax(0, 1fr); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
body.is-player.scr-table.lay-land.seated #app { grid-template-columns: minmax(0, 1fr) var(--col); }
body.is-player.scr-table.lay-land #stage { grid-row: 1; }
body.is-player.scr-table.lay-land #top { position: absolute; z-index: 6; top: 0; left: env(safe-area-inset-left); right: env(safe-area-inset-right); pointer-events: none; }
body.is-player.scr-table.lay-land.seated #top { right: calc(var(--col) + env(safe-area-inset-right)); }
body.is-player.scr-table.lay-land #dock { grid-row: 1; grid-column: 2; display: flex; flex-direction: column; min-height: 0; overflow-y: auto;
  border-top: 0; border-left: 1px solid var(--line); padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
  background: linear-gradient(180deg, #111b17, #0a100d); }
body.is-player.scr-table.lay-land:not(.seated) #dock { display: none; }

/* ---------------- felt */
.felt {
  position: absolute; left: 8%; right: 8%; top: 10%; bottom: 10%; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 38%, var(--felt0) 0%, var(--felt1) 48%, var(--felt2) 100%);
  box-shadow: 0 0 0 10px var(--rail), 0 0 0 14px var(--rail2), 0 18px 50px rgba(0, 0, 0, .65), inset 0 0 50px rgba(0, 0, 0, .45);
  box-shadow: 0 0 0 1.7cqmin var(--rail), 0 0 0 2.4cqmin var(--rail2), 0 2.4cqmin 7cqmin rgba(0, 0, 0, .65), inset 0 0 7cqmin rgba(0, 0, 0, .45);
}
.felt::after { content: ''; position: absolute; inset: 7%; border-radius: 50%; border: 1px solid rgba(230, 192, 104, .1); }
body.scr-home .felt, body.scr-connecting .felt, body.scr-lobby .felt, body.scr-dlobby .felt, body.scr-yield .felt { opacity: .35; }
.slot { display: contents; }

/* ---------------- seats: a pill with an avatar; the timer runs round the avatar */
.seat { position: absolute; z-index: 3; transform: translate(-50%, -50%); width: var(--sw); height: var(--ph); }
.plate {
  position: absolute; inset: 0; display: flex; align-items: center; gap: calc(var(--ph) * .12);
  padding: 0 calc(var(--ph) * .22) 0 2px; border-radius: 999px;
  background: linear-gradient(180deg, rgba(25, 35, 31, .97), rgba(9, 14, 12, .97)); border: 1px solid rgba(255, 255, 255, .14);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
}
.av {
  position: relative; flex: none; width: calc(var(--ph) - 4px); height: calc(var(--ph) - 4px); border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, hsl(var(--h) 46% 48%), hsl(var(--h) 42% 25%)); color: #fff;
  font-weight: 700; font-size: calc(var(--ph) * .4); box-shadow: inset 0 0 0 1.5px hsla(var(--h), 60%, 70%, .35);
}
.av.sm { width: 22px; height: 22px; font-size: 11px; }
.ring { position: absolute; inset: -3px; width: calc(100% + 6px); height: calc(100% + 6px); transform: rotate(-90deg); pointer-events: none; }
.ring circle { fill: none; stroke-width: 3.8; }
.ring .rt { stroke: rgba(0, 0, 0, .45); }
.ring .rg { stroke: var(--jade); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset .25s linear, stroke .3s; }
.ring.low .rg { stroke: var(--amber); }
.ring.crit .rg { stroke: var(--alarm); }
.av .sec { font: 700 calc(var(--ph) * .36) var(--mono); color: var(--gold); }
.info { flex: 1; min-width: 0; line-height: 1.12; }
.seat .nm { font-size: calc(var(--ph) * .3); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .stk { font: 600 calc(var(--ph) * .31) var(--mono); color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .dbtn {
  position: absolute; right: -5px; top: -7px; width: calc(var(--ph) * .44); height: calc(var(--ph) * .44); border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 40% 35%, #fffdf6, #e4ddcb); color: #1b1b1b; font: 700 calc(var(--ph) * .24) var(--sans); font-style: normal;
  box-shadow: 0 2px 5px rgba(0, 0, 0, .55), inset 0 0 0 1.5px rgba(0, 0, 0, .12);
}
.dbtn.in { position: static; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #f8f5ec; color: #1b1b1b; font-weight: 700; font-size: 12px; }
.seat.turn .plate { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(230, 192, 104, .35), 0 0 22px rgba(230, 192, 104, .3); animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 2px rgba(230, 192, 104, .6), 0 0 32px rgba(230, 192, 104, .5); } }
.seat.me .plate { border-color: rgba(71, 185, 142, .6); }
.seat.win .plate { border-color: var(--gold); background: linear-gradient(180deg, rgba(66, 52, 17, .97), rgba(27, 21, 8, .97)); }
.seat.fold .plate { opacity: .55; }
.seat.fold .av { filter: grayscale(.85); }
.seat.idle { opacity: .55; }
.seat.out { opacity: .4; filter: grayscale(1); }
.tag {
  position: absolute; left: 50%; z-index: 5; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
  font: 700 calc(var(--ph) * .27) var(--sans); padding: 1px 9px; border-radius: 99px; background: #2c3632; color: var(--ink);
  max-width: var(--sw); overflow: hidden; text-overflow: ellipsis; box-sizing: border-box;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .45); animation: pop .25s ease-out;
}
.seat.lo .tag, .seat.mid .tag, .seat.sl .tag, .seat.sr .tag { top: calc(100% - 2px); }
.seat.hi .tag { bottom: calc(100% - 2px); }
.tag.t-fold { background: #3b403e; color: #b8bfbb; }
.tag.t-check { background: #24496b; color: #dceaff; }
.tag.t-call { background: #1d6a4e; color: #e0f6ec; }
.tag.t-bet { background: #8b6416; color: #fff2d2; }
.tag.t-allin { background: #b3372a; color: #fff; }
.tag.t-blind { background: #2c3531; color: var(--ink2); }
.tag.t-time { background: #3b3220; color: var(--gold); }
.tag.t-win { background: var(--gold); color: #1d1607; font-family: var(--mono); box-shadow: 0 3px 12px rgba(230, 192, 104, .4); }
.seat.sl .dbtn { right: auto; left: -5px; }
.av .fl { position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%); padding: 0 4px; border-radius: 6px; white-space: nowrap;
  font: 700 calc(var(--ph) * .2) / 1.25 var(--sans); background: rgba(150, 45, 32, .95); color: #ffe1da; box-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.sub { position: absolute; left: 50%; z-index: 5; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 3px; white-space: nowrap; pointer-events: none; }
.seat.lo .sub { bottom: calc(100% + var(--ch) - 2px); }
.seat.hi .sub { top: calc(100% + var(--ch) - 2px); }
.seat.mid .sub { top: calc(100% + 16px); }
.seat.si-l .sub { left: calc(100% + 6px); right: auto; top: 50%; bottom: auto; transform: translateY(-50%); align-items: flex-start; }
.seat.si-r .sub { left: auto; right: calc(100% + 6px); top: 50%; bottom: auto; transform: translateY(-50%); align-items: flex-end; }
.seat.sl.si-l .sub { left: calc(100% + var(--cw) * 1.85 + 2px); }
.seat.sr.si-r .sub { right: calc(100% + var(--cw) * 1.85 + 2px); }
.flag, .hn, .tcn { border-radius: 9px; padding: 1px 8px; font-size: calc(var(--ph) * .26); background: rgba(0, 0, 0, .6); color: var(--ink2); }
.flag { background: rgba(120, 40, 30, .8); color: #ffd4cc; }
.hn { color: var(--ink); }
.seat .stk .hnm { font: 600 calc(var(--ph) * .26) var(--sans); color: var(--ink); }
.tcn { background: rgba(230, 192, 104, .18); color: var(--gold); }
.wonb {
  text-align: center; border-radius: 8px; padding: 2px 10px; background: var(--gold); color: #1d1607;
  font: 700 calc(var(--ph) * .32) var(--mono); box-shadow: 0 4px 14px rgba(230, 192, 104, .35); animation: pop .4s cubic-bezier(.2, 1.6, .4, 1) both .25s;
}
.wonb small { display: block; font: 600 calc(var(--ph) * .24) var(--sans); }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }

/* hole cards sit on the table side of each seat */
.hand-w { position: absolute; z-index: 2; pointer-events: none; }
.hand-w.lo, .hand-w.mid { transform: translate(-50%, calc(-100% - var(--ph) * .5 + 5px)); }
.hand-w.hi { transform: translate(-50%, calc(var(--ph) * .5 - 5px)); }
.hand-w.sl { transform: translate(calc(var(--sw) * .5 - 8px), -50%); }
.hand-w.sr { transform: translate(calc(-100% - var(--sw) * .5 + 8px), -50%); }
.hand-w.gone { opacity: .5; }
.hand { display: flex; perspective: 500px; }
.hand .cd + .cd { margin-left: calc(var(--cw) * -.22); }

/* ---------------- chips */
.bet {
  position: absolute; z-index: 2; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; white-space: nowrap;
  padding: 2px 9px 2px 3px; border-radius: 99px; background: rgba(0, 0, 0, .45); font: 600 calc(var(--ph) * .3) var(--mono);
}
.bet.push { animation: push .4s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes push { from { transform: translate(-50%, -50%) translate(calc(var(--fx) * 1cqw), calc(var(--fy) * 1cqh)) scale(.6); opacity: .15; } }
.cp {
  display: inline-block; flex: none; width: calc(var(--ph) * .36); height: calc(var(--ph) * .36); border-radius: 50%;
  background: radial-gradient(circle, #f4efe2 0 30%, #c8402f 31% 58%, #f4efe2 59% 66%, #c8402f 67%);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(0, 0, 0, .15);
}
.panel .cp, #dock .cp { width: 14px; height: 14px; }
.winfly { position: absolute; z-index: 4; transform: translate(-50%, -50%); display: flex; gap: 2px; pointer-events: none; animation: winfly .8s cubic-bezier(.3, .7, .3, 1) .2s both; }
.winfly .cp:nth-child(2) { margin-top: -6px; } .winfly .cp:nth-child(3) { margin-top: 4px; }
@keyframes winfly {
  from { transform: translate(-50%, -50%) translate(calc(var(--fx) * 1cqw), calc(var(--fy) * 1cqh)); opacity: 1; }
  75% { opacity: 1; }
  to { opacity: 0; }
}

/* ---------------- centre: pot, board, what is happening */
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1; text-align: center; width: var(--cbw, 66cqmin); pointer-events: none; }
.potrow { height: calc(var(--ph) * .66); margin-bottom: var(--cgap, 1.2cqmin); display: flex; align-items: center; justify-content: center; }
.pot { display: inline-flex; align-items: center; gap: 6px; padding: 2px 12px 2px 4px; border-radius: 99px; background: rgba(0, 0, 0, .38); font-size: calc(var(--ph) * .3); color: var(--ink2); }
.pot b { font-family: var(--mono); color: var(--ink); }
.pot.bump { animation: bump .5s ease-out; }
@keyframes bump { 30% { transform: scale(1.14); background: rgba(230, 192, 104, .28); } }
.board { display: flex; justify-content: center; gap: var(--bgap, 1.2cqmin); perspective: 800px; }
.note { margin-top: var(--cgap, 1.4cqmin); height: var(--noteh, 8cqmin); overflow: hidden; font-size: calc(var(--ph) * .3); line-height: 1.4; }
.note.many { font-size: calc(var(--ph) * .22); line-height: 1.32; }
.note.tiny { font-size: calc(var(--ph) * .17); line-height: 1.28; }
.note b, .note .who { color: var(--gold); font-weight: 600; }
.note .tcs { color: var(--gold); opacity: .85; white-space: nowrap; }
.hno { margin-top: 2px; font: 500 calc(var(--ph) * .22) / 1.3 var(--mono); color: rgba(238, 234, 223, .35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------------- cards */
.cd {
  position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; flex: none;
  background: linear-gradient(170deg, #fffdf7, var(--card) 60%, #efe9dc); color: var(--cink); border-radius: 5px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .45); line-height: 1; user-select: none; backface-visibility: hidden;
}
.cd b { font-weight: 700; letter-spacing: -.05em; }
.cd svg { fill: currentColor; display: block; }
.cd.sh, .cd.sd { color: var(--red); }
body.four .cd.sd { color: var(--blue); }
body.four .cd.sc { color: var(--green); }
.cd.back {
  background: repeating-linear-gradient(45deg, #8f2c24 0 3px, #a7372d 3px 6px); border: 2px solid #f3eee2;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(0, 0, 0, .2);
}
.cd.slot { background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .13); }
.cd.hl { box-shadow: 0 0 0 2px var(--gold), 0 0 14px rgba(230, 192, 104, .45); }
.cd.dim { filter: brightness(.5); }
.cd.xs { width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .13); }
.cd.xs b { font-size: calc(var(--cw) * .58); }
.cd.xs svg { width: calc(var(--cw) * .46); height: calc(var(--cw) * .46); }
.cd.xs.back { border-width: calc(var(--cw) * .07); }
.cd.md { width: var(--bw, 40px); height: var(--bh, 56px); border-radius: calc(var(--bw, 40px) * .127); }
.cd.md b { font-size: calc(var(--bw, 40px) * .6); }
.cd.md svg { width: calc(var(--bw, 40px) * .47); height: calc(var(--bw, 40px) * .47); }
.cd.sm { width: 34px; height: 47px; }
.cd.sm b { font-size: 19px; }
.cd.sm svg { width: 15px; height: 15px; }
.cd.lg { width: var(--lw); height: calc(var(--lw) * 1.4); border-radius: calc(var(--lw) * .12); }
.cd.lg b { font-size: calc(var(--lw) * .5); }
.cd.lg svg { width: calc(var(--lw) * .38); height: calc(var(--lw) * .38); }
.cd.deal { animation: dealfly .45s cubic-bezier(.18, .8, .3, 1) both; }
@keyframes dealfly {
  from { transform: translate(calc(var(--fx) * 1cqw), calc(var(--fy) * 1cqh)) rotate(-28deg) scale(.55); opacity: 0; }
  12% { opacity: 1; }
}
.cd.flip { animation: flipin .5s cubic-bezier(.2, .7, .3, 1) both; }
@keyframes flipin { from { transform: rotateY(95deg) scale(.9); filter: brightness(.55); } }
.ci {
  display: inline-flex; align-items: center; margin: 0 2px; padding: 0 3px; border-radius: 3px; line-height: 1.35;
  background: var(--card); color: var(--cink); font-weight: 700; font-size: .92em;
}
.ci svg { width: .82em; height: .82em; fill: currentColor; margin-left: 1px; }
.ci.sh, .ci.sd { color: var(--red); }
body.four .ci.sd { color: var(--blue); }
body.four .ci.sc { color: var(--green); }

/* ---------------- level, blinds, tools */
.hud {
  display: flex; align-items: center; gap: 12px; padding: 7px 12px; padding-top: max(7px, env(safe-area-inset-top));
  background: linear-gradient(#111a16, #0b110e); border-bottom: 1px solid var(--line);
}
.hud-l { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; min-width: 0; }
.hl1, .hl2, .hl3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.lvchip { font: 700 11.5px var(--mono); color: #1d1607; background: var(--gold); border-radius: 6px; padding: 2px 7px; }
.bl { font: 600 13.5px var(--mono); color: var(--ink); white-space: nowrap; }
.bl small { font: 500 11.5px var(--sans); color: var(--ink2); margin-left: 3px; }
.nxt { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); font-size: 12.5px; white-space: nowrap; }
.nxt b { font-family: var(--mono); color: var(--ink); }
.nxt.up b { color: var(--gold); }
.lvbar { display: inline-block; width: 44px; height: 4px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.lvbar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 1s linear; }
.cnt { color: var(--ink3); font-size: 12.5px; white-space: nowrap; }
.watch { font-size: 11.5px; color: var(--ink2); border: 1px dashed rgba(238, 234, 223, .25); border-radius: 99px; padding: 1px 8px; }
.hud-r { margin-left: auto; display: flex; gap: 6px; flex: none; }
.ic { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 12.5px; color: var(--ink2); }
.ic:hover { color: var(--ink); border-color: rgba(238, 234, 223, .3); }
.ic.snd { color: var(--gold); border-color: rgba(230, 192, 104, .4); }
.mn { font-size: 12px; color: var(--ink2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.mn.bubble { color: #1d1607; background: var(--amber); border-color: transparent; font-weight: 600; }
.mn.itm { color: #04140d; background: var(--jade); border-color: transparent; font-weight: 600; }
.warn { background: #5b1f17; color: #ffdcd5; font-size: 13px; padding: 6px 12px; text-align: center; pointer-events: auto; }
.rotate { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(230, 192, 104, .1); border-bottom: 1px solid rgba(230, 192, 104, .22); color: var(--gold); font-size: 12.5px; }
.rot-ic { flex: none; width: 10px; height: 16px; border: 2px solid currentColor; border-radius: 3px; animation: rot 2.6s ease-in-out infinite; }
@keyframes rot { 0%, 25% { transform: rotate(0); } 45%, 75% { transform: rotate(90deg); } 95%, 100% { transform: rotate(0); } }

/* ---------------- my cards and controls */
#dock { background: linear-gradient(180deg, #0f1814, #0b110e); border-top: 1px solid var(--line); padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }

.mine { --lw: clamp(50px, 14vw, 78px); display: flex; flex-direction: column; align-items: center; gap: 5px; flex: none; }
.mine .cards { display: flex; gap: 6px; perspective: 600px; }

.hs { min-height: 16px; font-size: 12.5px; font-weight: 600; color: var(--gold); text-align: center; max-width: 180px; }
.me-stk, .tinfo { display: none; }

.myturn { display: flex; align-items: center; gap: 8px; min-width: 0; }

.mt-bar .bar-i { position: absolute; inset: 0; background: var(--jade); transform-origin: left center; transition: transform .2s linear; }
.mt-bar.low .bar-i { background: var(--amber); }
.mt-bar.crit .bar-i { background: var(--alarm); }
.mt-t { font: 600 14px var(--mono); min-width: 34px; text-align: right; }
.aux { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.abtns { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.abtns .fold { order: 1; }
.abtns .call { order: 2; }
.abtns .raise { order: 3; }
.btn {
  border: 1px solid var(--line); background: var(--panel2); border-radius: 12px; padding: 10px 8px; font-size: 15px; font-weight: 700;
  min-height: 48px; line-height: 1.15; transition: transform .06s, filter .15s;
}
.btn small { display: block; margin-top: 2px; font: 600 12px var(--mono); opacity: .85; }

.btn.small { min-height: 38px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.btn.big { width: 100%; padding: 15px; font-size: 16.5px; margin-top: 10px; }
.btn.fold { background: linear-gradient(180deg, #3a1d18, #2a1512); border-color: #6a3026; color: #f6c0b4; }

.pre { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pre-h { grid-column: 1 / -1; font-size: 11.5px; color: var(--ink3); }
.pchip {
  display: flex; align-items: center; gap: 7px; min-height: 42px; text-align: left; border: 1px solid var(--line);
  background: rgba(255, 255, 255, .03); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; color: var(--ink2);
}

.rpanel { display: flex; flex-direction: column; gap: 8px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 10px; }
.rp-top { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--ink2); }

.rp-cur { font: 700 20px var(--mono); color: var(--gold); margin-left: 4px; }
input#ramt {
  flex: 1; min-width: 0; width: 100%; padding: 4px 0; text-align: left; font: 700 22px var(--mono); color: var(--gold); background: transparent;
  border: 0; border-bottom: 1px dashed rgba(230, 192, 104, .4); border-radius: 0;
}

.presets { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }

@media (max-width: 420px) {

}
/* sideways: everything stacks in the right-hand column, buttons at thumb height */

/* ---------------- overlays, panels */
#overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; overflow: auto; background: rgba(5, 9, 7, .7); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.panel {
  width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, .55); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto;
}
.panel h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.01em; }
.panel h3 { margin: 18px 0 8px; font-size: 13.5px; color: var(--ink2); font-weight: 600; }

.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }

.lead { font-size: 14.5px !important; }
.lead b { color: var(--ink); }
.field { margin: 14px 0; }
.field label { display: block; font-size: 13px; color: var(--ink2); margin-bottom: 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 8px 13px; font-size: 14px; }
.chip.on { background: var(--gold); color: #1d1607; border-color: transparent; font-weight: 600; }
input#nickIn, input#stackIn, input#linkIn {
  background: var(--sunk); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px; min-width: 0;
}
input#stackIn { width: 120px; padding: 7px 12px; border-radius: 999px; font-size: 14px; }
input#stackIn.on { border-color: var(--gold); color: var(--gold); }
.join, .linkbox { display: flex; gap: 8px; margin-top: 14px; }
.join input, .linkbox input { flex: 1; }
.linkbox input { font-family: var(--mono); font-size: 13px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: #1d1607; background: var(--gold); border-radius: 6px; padding: 2px 8px; margin-bottom: 8px; }
.plist { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.plist li { display: flex; align-items: center; gap: 10px; background: var(--panel2); border-radius: 10px; padding: 9px 12px; }
.plist li.empty { color: var(--ink3); justify-content: center; }

.plist .nm em, .drawlist em { font-style: normal; font-size: 11px; color: var(--gold); border: 1px solid rgba(230, 192, 104, .5); border-radius: 5px; padding: 0 4px; margin-left: 4px; }
.plist .st { font-size: 13px; color: var(--ink3); }

.plist .pz.none { color: var(--ink3); }
.panel .prize { text-align: center; color: var(--gold) !important; font-size: 13.5px; margin: 12px 0 0 !important; }

.plist li.me { box-shadow: inset 0 0 0 1px rgba(230, 192, 104, .35); }
.places li.champ { background: rgba(230, 192, 104, .14); }
.places li.champ .no { color: var(--gold); }
.go { text-align: center; margin: 16px 0 4px; font-size: 16px; }
.go b { font: 600 24px var(--mono); color: var(--gold); }
.go.dim { color: var(--ink3); font-size: 13.5px; }
.link { background: none; border: 0; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; padding: 8px; font-size: 13.5px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.row.left { justify-content: flex-start; }
.spin { width: 30px; height: 30px; margin: 4px auto 14px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .14); border-top-color: var(--gold); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.panel.connecting { text-align: center; }

.drawlist li { display: flex; align-items: center; gap: 10px; background: var(--panel2); border-radius: 10px; padding: 8px 10px; }
.drawlist li.win { box-shadow: inset 0 0 0 1px var(--gold); }
.drawlist .nm { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.last { margin-top: 12px !important; text-align: center; }

/* the dealer screen is read from across a room */
body.is-dealer .panel.dl { width: min(820px, 100%); padding: 28px 30px; }

@media (max-height: 500px) {

/* ---------------- sheet */

.sheet-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .5); }
.sheet-in {
  position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(700px, 100%); max-height: 86vh; max-height: 86dvh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 18px 18px max(18px, env(safe-area-inset-bottom));
}

@keyframes up { from { transform: translate(-50%, 30px); opacity: .4; } to { transform: translate(-50%, 0); opacity: 1; } }
.sheet-in h2 { font-size: 19px; margin: 4px 0 8px; }

.hlist pre { white-space: pre-wrap; word-break: keep-all; font: 12.8px/1.65 var(--sans); background: var(--sunk); border-radius: 10px; padding: 10px 12px; margin: -2px 0 10px; color: var(--ink2); }
table.struct { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 6px; }

.struct th { color: var(--ink3); font-weight: 600; }
.struct td { font-family: var(--mono); }

.rules { padding-left: 18px; color: var(--ink2); font-size: 14px; line-height: 1.6; margin: 6px 0 14px; }
.rules li { margin: 5px 0; }
.menu { display: grid; gap: 6px; }
.mi { text-align: left; background: var(--panel2); border: 0; border-radius: 10px; padding: 13px 14px; font-size: 14.5px; }
.mi.on::after { content: '켜짐'; float: right; color: var(--jade); font-size: 13px; }

#toast {
  position: fixed; left: 50%; top: max(4px, env(safe-area-inset-top)); z-index: 45; max-width: min(92vw, 560px); transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
  background: rgba(20, 31, 26, .98); border: 1px solid rgba(230, 192, 104, .3); border-radius: 12px; padding: 7px 14px; font-size: 13.5px; line-height: 1.35; text-align: center;
  transition: .25s; box-shadow: 0 6px 20px rgba(0, 0, 0, .5);
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

<script>
/* Holdem — no-limit Texas hold'em tournament rules, pure and deterministic.

 * The dealer page keeps the whole state S, deck and hole cards included; pub(S) is the part any

 * the small blind; minimum bet = big blind, minimum raise = the last full bet or raise; a short
 * all-in does not reopen the betting; uncalled chips go back; side pots; the odd chip goes to the
 * first winner left of the button; all hands are tabled once someone is all-in and the betting is

 * the same hand are ranked by their stacks at the start of it.

  var LEVELS = [[1, 2], [2, 4], [3, 6], [5, 10], [10, 20], [15, 30], [20, 40], [30, 60], [50, 100], [75, 150],
    [100, 200], [150, 300], [200, 400], [300, 600], [500, 1000], [750, 1500], [1000, 2000], [1500, 3000],
    [2000, 4000], [3000, 6000], [5000, 10000]];

  // The buy-in is the starting stack, so the prize pool is players x stack. Places paid and the
  // split follow the usual single-table shape: 2-4 players winner takes all, 5-8 pay 65/35,
  // 9 pay 50/30/20. Rounding leftovers go to first place.

  function loadKeys() {
    var p = O.id.jwk ? HC.loadKey(O.id.jwk).catch(function () { return HC.newKey(); }) : HC.newKey();
    return p.then(function (k) { O.key = k; O.id.jwk = k.jwk; });
  }

  function enterRoom(code) {
    O.code = code;
    if (!HC.supported || !RL || !RL.supported) { O.unsupported = true; render(); return; }
    var host = LS.get('hd.host.' + code, null), sess = SS.get('hd.sess.' + code, null);
    if (sess && sess.pid === code && host && host.jwk) {
      O.dealer = true; O.how = 'session'; O.id = { pid: code, nick: '딜러', jwk: host.jwk };
    } else if (sess && sess.pid && sess.pid !== code && sess.jwk) {
      O.how = 'session'; O.id = { pid: sess.pid, nick: cleanNick(sess.nick), jwk: sess.jwk }; O.want = sess.want ? 1 : 0;
    } else {
      O.how = 'fresh'; O.id = { pid: rid(8), nick: cleanNick(LS.get('hd.nick', '')), jwk: null };
    }
    render();
    loadKeys().then(function () {
      saveSess();
      if (O.dealer) startDealer();
      connect();
      keepAwake();
      render();
    }, function () { O.unsupported = true; render(); });
  }

  function connect() {
    if (O.relay) { try { O.relay.leave(); } catch (e) { /* ignore */ } }
    var r = RL.join(O.code);
    O.relay = r;
    r.onConnection(function (live) {
      if (O.relay !== r) return;
      O.conn = live;
      if (live) O.liveAt = Date.now();
      render();
    });
    r.onPeers(function (ch) { if (O.relay === r) onPeers(ch.peers); });
    publish();
  }
  function presence() {
    var p = { app: APP, pid: O.id.pid, sid: O.sid, since: O.since, nick: O.id.nick || '', pk: O.key ? O.key.pk : '' };
    if (O.dealer) {
      p.role = 'd'; p.T = D.ready ? D.T : null; p.H = D.ready ? D.H : null;
      p.want = null; p.rdy = null; p.away = null; p.q = null; p.ai = null;
    } else {
      p.role = null; p.T = null; p.H = null;
      p.want = O.want; p.rdy = O.rdy; p.away = O.away; p.q = O.q; p.ai = O.ai;
    }
    return p;
  }
  function publish() { if (O.relay && !O.yielded && O.key) O.relay.presence(presence()); }

  function onPeers(list) {
    var out = [];
    list.forEach(function (x) {
      var p = x.presence;
      if (!p || p.app !== APP || typeof p.pid !== 'string' || !/^[a-z0-9]{6,8}$/.test(p.pid)) return;
      out.push({
        pid: p.pid, sid: String(p.sid || ''), since: +p.since || 0, nick: cleanNick(p.nick),
        pk: typeof p.pk === 'string' ? p.pk : '', want: !!p.want, rdy: +p.rdy || 0, away: !!p.away,
        q: Array.isArray(p.q) ? p.q.slice(-8) : [], dealer: p.role === 'd',
        ai: p.ai && typeof p.ai === 'object' ? { at: +p.ai.at || 0, n: Math.floor(+p.ai.n) || 0, lv: Math.floor(+p.ai.lv) || 2 } : null,
        T: p.T && typeof p.T === 'object' ? p.T : null, H: p.H && typeof p.H === 'object' ? p.H : null,
        clock: +x.clock || 0, at: x.updatedAt || 0
      });
    });
    O.peers = out;
    if (checkClash()) return;
    if (O.dealer) dealerKick(); else pickDealer();
    render();
  }

  function pickDealer() {
    var best = null;
    O.peers.forEach(function (p) {
      if (p.pid !== O.code || !p.dealer || !p.T || typeof p.T.v !== 'number') return;
      if (!best || p.since > best.since || (p.since === best.since && p.T.v > best.T.v)) best = p;
    });
    O.dealerHere = !!best;
    if (!best) return;
    O.off = best.clock; O.dealerPk = best.pk;
    if (best.sid !== O.dealerSid || best.T.v > O.Tv || (best.T.v === O.Tv && best.H !== O.H)) {
      O.dealerSid = best.sid; O.T = best.T; O.Tv = best.T.v; O.H = best.H;
      onTable(O.T);
    }
  }

  // the same identity open twice: the newer page keeps it, the older one steps aside
  function checkClash() {
    if (O.yielded || !O.id) return false;
    var me = O.id.pid;
    var newer = O.peers.some(function (p) {
      return p.pid === me && p.sid !== O.sid && (p.since > O.since || (p.since === O.since && p.sid > O.sid));
    });
    if (!newer) return false;
    O.yielded = true;
    if (O.relay) { var r = O.relay; O.relay = null; try { r.leave(); } catch (e) { /* ignore */ } }
    O.conn = false;
    stopDealer();
    render();
    return true;
  }
  function takeBack() {
    O.yielded = false; O.since = Date.now();
    if (O.dealer) startDealer();
    connect();
    render();
  }

  function maintain() {
    if (!O.relay || O.yielded || !O.conn || O.dealer || !O.key) return;
    var now = Date.now();
    if (now - O.liveAt < SETTLE || O.how !== 'fresh' || O.reclaimDone || O.want) return;
    var host = LS.get('hd.host.' + O.code, null);
    var dealerHere = O.peers.some(function (p) { return p.pid === O.code; });
    if (host && host.jwk && !dealerHere) { becomeDealer(host); return; }
    var T = O.T;
    if (!T) return;                          // keep looking until the table shows up
    O.reclaimDone = true;
    if (T.st !== 'run' && T.st !== 'end') return;
    var cand = idList().filter(function (x) {
      return x && x.pid !== O.id.pid && x.jwk && T.seats.some(function (s) { return s.pid === x.pid; }) &&
        !O.peers.some(function (p) { return p.pid === x.pid; });
    })[0];
    if (cand) switchTo(cand);
  }
  function switchTo(id) {
    O.id = { pid: id.pid, nick: cleanNick(id.nick), jwk: id.jwk };
    O.want = 1; O.how = 'session'; O.cards = null; O.cardsTry = ''; O.q = []; O.pending = null;
    loadKeys().then(function () { saveSess(); saveId(); publish(); onTable(O.T); render(); toast('내 자리로 돌아왔어요'); });
  }
  function becomeDealer(host) {
    O.dealer = true; O.how = 'session'; O.want = 0; O.T = null; O.Tv = -1;
    O.id = { pid: O.code, nick: '딜러', jwk: host.jwk };
    loadKeys().then(function () { O.since = Date.now(); saveSess(); startDealer(); publish(); render(); });
  }

  // ------------------------------------------------------------ dealer
  function startDealer() {
    D.ready = false; D.waitFrom = Date.now();
    if (!D.stopTick) D.stopTick = RL.ticker(dealerKick, 250);
    dealerKick();
  }
  function stopDealer() {
    if (D.stopTick) { D.stopTick(); D.stopTick = null; }
    D.ready = false;
  }
  function loadDealer() {
    var host = LS.get('hd.host.' + O.code, null) || {};
    D.cfg = validCfg(host.cfg); D.S = host.S || null; D.round = host.round || 1; D.v = host.v || 0;
    D.joinAt = host.joinAt || {}; D.last = host.last || null; D.made = host.made || Date.now(); D.aiAt = host.aiAt || 0;
    D.go = 0; D.sig = ''; D.enc = null; D.seen = {}; D.offSince = {}; D.bot = null; D.vnow = 0; D.fast = false;
    if (D.S && D.S.st === 'run' && host.at) {
      var gap = Date.now() - host.at;
      if (gap > 1500) HD.delay(D.S, gap);        // nobody's clock ran while the dealer page was away
    }
    D.lastTick = Date.now(); D.ready = true;
  }
  function persistDealer(now) {
    LS.set('hd.host.' + O.code, { cfg: D.cfg, S: D.S, round: D.round, v: D.v, joinAt: D.joinAt, last: D.last, at: now, jwk: O.id.jwk, made: D.made, aiAt: D.aiAt });
  }
  function dealerKick() {
    if (!O.dealer || D.queued) return;
    D.queued = true;
    D.chain = D.chain.then(function () { D.queued = false; return dealerStep(); })
      .catch(function (e) { D.queued = false; try { console.error(e); } catch (e2) { /* ignore */ } });
  }
  function linkOk(now) { return !!(O.relay && O.conn && now - O.liveAt >= 3000 && now - O.relay.lastRx() < 4500); }
  function otherPeers() {
    var by = {};
    O.peers.forEach(function (p) {
      if (p.pid === O.id.pid) return;
      var c = by[p.pid];
      if (!c || p.since > c.since) by[p.pid] = p;
    });
    return Object.keys(by).map(function (k) { return by[k]; });
  }

  async function dealerStep() {
    if (!O.dealer || O.yielded || !O.relay || !O.key) return;
    var now = Date.now(), dirty = false;
    if (!D.ready) {
      var other = O.peers.some(function (p) { return p.pid === O.code && p.sid !== O.sid; });
      if (other && now - D.waitFrom < 4000) return;              // the older page steps aside first
      if (!O.conn && now - D.waitFrom < 2500) return;
      loadDealer(); dirty = true;
    }
    if (D.S && D.S.st === 'run' && now - D.lastTick > 4000) { HD.delay(D.S, now - D.lastTick - 250); dirty = true; }
    D.lastTick = now;
    var peers = otherPeers();
    if (!D.S) dirty = lobbyStep(peers, now) || dirty;
    else if (D.S.st === 'run') dirty = (await runStep(peers, now)) || dirty;
    else dirty = endStep(peers) || dirty;
    if (dirty) await dealerPublish(Date.now());
  }

  function lobbyStep(peers, now) {
    var list = [];
    peers.forEach(function (p) {
      if (!p.want || !p.pk || !p.nick || /^aibot/.test(p.pid)) return;
      if (!D.joinAt[p.pid]) D.joinAt[p.pid] = now;
      list.push({ pid: p.pid, nick: p.nick, pk: p.pk, rdy: p.rdy === D.round ? 1 : 0, at: D.joinAt[p.pid] });
      // a player changed the AI seats from the lobby: the newest change wins
      var r = p.ai;
      if (r && typeof r === 'object' && +r.at > D.aiAt && +r.at < now + 10000) {
        D.aiAt = +r.at;
        D.cfg = validCfg({ stack: D.cfg.stack, lvlMin: D.cfg.lvlMin, act: D.cfg.act, tc: D.cfg.tc, bots: r.n, botLv: r.lv });
      }
    });
    list.sort(function (a, b) { return a.at - b.at || (a.pid < b.pid ? -1 : 1); });
    var humans = list.slice(0, MAX_SEATS), wait = list.slice(MAX_SEATS), seats = humans.slice(), k;
    for (k = 0; k < D.cfg.bots && seats.length < MAX_SEATS; k++) seats.push({ pid: 'aibot' + (k + 1), nick: BOT_NAMES[k], pk: '', rdy: 1, bot: D.cfg.botLv });
    var allReady = humans.length >= 1 && seats.length >= 2 && humans.every(function (x) { return x.rdy; });
    var sig = JSON.stringify([seats.map(function (x) { return [x.pid, x.nick, x.rdy, x.bot || 0]; }), wait.map(function (x) { return x.pid; }), allReady, D.cfg.bots, D.cfg.botLv]);
    var changed = sig !== D.sig;
    if (allReady && !D.allReady && D.ready) chime();             // everyone is ready: tell the dealer screen
    D.sig = sig; D.lobby = seats; D.wait = wait; D.go = 0; D.allReady = allReady;
    var start = D.startReq;
    D.startReq = false;
    if (start && !allReady) toast('아직 준비하지 않은 사람이 있어요');
    if (start && allReady) {
      D.S = HD.create(D.cfg, seats.map(function (x) { return { pid: x.pid, nick: x.nick, pk: x.pk, bot: x.bot || 0 }; }), cryptoInt, now);
      D.go = 0; D.sig = ''; D.enc = null; D.seen = {}; D.offSince = {}; D.bot = null; D.vnow = 0; D.fast = false;
      var keep = {};
      seats.forEach(function (x) { keep[x.pid] = D.joinAt[x.pid]; });
      D.joinAt = keep;
      return true;
    }
    return changed;
  }

  function applyReq(S, seat, r, now) {
    var h = S.hand;
    if (!h || r.h !== h.no) return false;
    if (r.k === 'act') {
      if (r.n !== h.n || ['f', 'k', 'c', 'r', 'A'].indexOf(r.a) < 0) return false;
      return HD.act(S, seat, r.a, +r.x || 0, now) === '';
    }
    if (r.k === 'tc') {
      if (r.n !== h.n || h.actor !== seat) return false;
      var used = false, want = Math.min(+r.c || 0, 20);
      while (h.tcu < want && HD.useTimeCard(S, seat, now)) used = true;
      return used;
    }
    if (r.k === 'show') return HD.showCards(S, seat);
    return false;
  }
  function openReq(seat, it) {
    return HC.shared(O.key, seat.pk, 'cards|' + O.code).then(function (key) {
      return HC.openText(key, it.e, O.code + '|q|' + seat.pid + '|' + it.s);
    }).then(function (txt) {
      if (!txt) return null;
      var r = JSON.parse(txt);
      return r && typeof r === 'object' && typeof r.h === 'number' ? r : null;
    }).catch(function () { return null; });
  }

  function humansIn(S) { return S.seats.some(function (p) { return !p.bot && !p.out; }); }
  // how long an AI seems to think: a beat longer facing a big bet, and never while cards are still flying
  function botThink(S, h) {
    var L = HD.legal(h, S.seats, h.actor), t = 650 + Math.random() * 1100, last = h.log[h.log.length - 1], live = 0;
    if (h.street) t += 250;
    if (L && L.toCall > 0) t += 250 + Math.min(900, 900 * L.toCall / Math.max(1, S.seats[h.actor].stack + L.toCall));
    h.live.forEach(function (x) { if (x) live++; });
    if (h.n === 0) t += DEAL_BASE + 2 * live * DEAL_GAP + 450;
    else if (last && last.d) t += 450;
    return t;
  }
  function botMove(S, h, now, iters) {
    var p = S.seats[h.actor], ch = null;
    try { ch = ADV.botAct(ADV.ctxFrom(h, S.seats, h.actor, h.holes[h.actor]), p.bot || 2, Math.random, iters); } catch (e) { ch = null; }
    if (!ch || HD.act(S, h.actor, ch.a, ch.x, now) !== '') HD.autoAct(S, now, 'a');
  }
  // nobody human is still in: play the rest out on a fast clock so the results (and '다시 하기') come soon
  function fastStep(S, now) {
    var t0 = Date.now(), n = 0;
    if (D.vnow < now) D.vnow = now;
    D.fast = true;
    while (S.st === 'run' && Date.now() - t0 < 30 && n++ < 600) {
      var h = S.hand;
      if (h && h.actor >= 0 && !h.next) { botMove(S, h, D.vnow, 120); D.vnow += 1500; continue; }
      var at = !h ? S.firstAt : h.next ? h.next.at : 0;
      if (at > D.vnow) D.vnow = at;
      var adv = HD.advance(S, D.vnow);
      if (adv === 'hand') HD.startHand(S, D.vnow, cryptoInt);
      else if (!adv) D.vnow += 1000;
    }
    if (S.st === 'end') { S.endAt = Date.now(); D.vnow = 0; D.fast = false; }
    return true;
  }

  async function runStep(peers, now) {
    var S = D.S, dirty = false, byPid = {}, i, j;
    if (!humansIn(S)) return fastStep(S, now);
    D.fast = false;
    peers.forEach(function (p) { byPid[p.pid] = p; });
    for (i = 0; i < S.seats.length; i++) {
      var seat = S.seats[i], p = byPid[seat.pid], last = D.seen[seat.pid] || 0;
      if (!p || !p.q.length || !seat.pk || p.pk !== seat.pk) continue;
      var items = p.q.filter(function (it) { return it && typeof it.s === 'number' && typeof it.e === 'string' && it.s > last; })
        .sort(function (a, b) { return a.s - b.s; });
      for (j = 0; j < items.length; j++) {
        D.seen[seat.pid] = items[j].s;
        var req = await openReq(seat, items[j]);
        if (req && applyReq(S, i, req, Date.now())) dirty = true;
      }
    }
    now = Date.now();
    var h = S.hand;
    if (h && h.actor >= 0 && !h.next && S.seats[h.actor].bot) {
      var bk = S.tid + ':' + h.no + ':' + h.n;
      if (!D.bot || D.bot.k !== bk) D.bot = { k: bk, at: now + botThink(S, h) };
      else if (now >= D.bot.at) { botMove(S, h, now, 0); D.bot = null; dirty = true; }
    } else if (h && h.actor >= 0 && !h.next) {
      var who = S.seats[h.actor], pg = byPid[who.pid];
      if (pg) delete D.offSince[who.pid];
      else if (!D.offSince[who.pid]) D.offSince[who.pid] = now;
      if (pg && pg.away && now - h.turnAt >= AWAY_ACT) { if (HD.autoAct(S, now, 'a')) dirty = true; }
      else if (!pg && linkOk(now) && now - Math.max(h.turnAt, D.offSince[who.pid]) >= OFFLINE_ACT) {
        if (HD.autoAct(S, now, 'o')) dirty = true;
      }
    }
    if (HD.timeout(S, now)) dirty = true;
    var adv = HD.advance(S, now);
    if (adv === 'hand') { if (HD.startHand(S, now, cryptoInt)) dirty = true; }
    else if (adv) dirty = true;
    return dirty;
  }

  function endStep(peers) {
    if (!peers.some(function (p) { return p.want && p.rdy === D.round + 1; })) return false;
    var S = D.S;
    D.last = { tid: S.tid, hands: S.handNo, places: S.seats.map(function (p) { return [p.nick, p.place, p.prize || 0]; }).sort(function (a, b) { return a[1] - b[1]; }) };
    D.S = null; D.round++; D.go = 0; D.sig = ''; D.enc = null;
    return true;
  }

  function cardsLabel(tid, no, seat, pid) { return O.code + '|' + tid + '|' + no + '|' + seat + '|' + pid; }
  async function sealHoles(S) {
    var h = S.hand, map = {}, i;
    if (D.enc && D.enc.tid === S.tid && D.enc.no === h.no) return D.enc.map;
    for (i = 0; i < S.seats.length; i++) {
      var seat = S.seats[i];
      if (!h.live[i] || !h.holes[i] || !seat.pk) continue;
      try {
        var key = await HC.shared(O.key, seat.pk, 'cards|' + O.code);
        map[i] = await HC.seal(key, new Uint8Array(h.holes[i]), cardsLabel(S.tid, h.no, i, seat.pid));
      } catch (e) { /* a broken key: that player gets no cards and will be folded by the clock */ }
    }
    D.enc = { tid: S.tid, no: h.no, map: map };
    return map;
  }

  async function dealerPublish(now) {
    var T, Hm = null;
    D.v++;
    if (!D.S) {
      T = {
        v: D.v, st: 'lobby', round: D.round, cfg: D.cfg, go: 0, ready: D.allReady ? 1 : 0, last: D.last,
        lobby: D.lobby.map(function (x) { return { pid: x.pid, nick: x.nick, rdy: x.rdy, bot: x.bot || 0 }; }), aiAt: D.aiAt,
        wait: D.wait.map(function (x) { return { pid: x.pid, nick: x.nick }; })
      };
    } else {
      T = HD.pub(D.S, D.fast && D.vnow ? D.vnow : now);
      T.v = D.v; T.round = D.round; T.lvlEnd = now + T.lvlLeft;
      if (D.fast) { T.fast = 1; if (T.hand) T.hand.dl = 0; }
      if (D.S.hand) Hm = await sealHoles(D.S);
    }
    T.now = now;
    D.T = T; D.H = Hm;
    persistDealer(now);
    publish();
    onTable(T);
    render();
  }

  // ------------------------------------------------------------ player
  function sendReq(r) {
    if (!O.dealerPk) { toast('딜러 화면과 아직 연결되지 않았어요'); return Promise.resolve(false); }
    var seq = Math.max(Date.now(), O.qseq + 1);
    O.qseq = seq;
    return HC.shared(O.key, O.dealerPk, 'cards|' + O.code).then(function (key) {
      return HC.sealText(key, JSON.stringify(r), O.code + '|q|' + O.id.pid + '|' + seq);
    }).then(function (e) {
      O.q = O.q.concat([{ s: seq, e: e }]).slice(-6);
      publish();
      return true;
    }, function () { toast('보내지 못했어요. 다시 눌러 주세요'); return false; });
  }

  function refreshCards() {
    var T = O.T, h = T && T.hand, me = mySeat();
    if (O.dealer || !h || me < 0 || !h.live[me] || !O.H || !O.H[me] || !O.dealerPk) return;
    if (O.cards && O.cards.tid === T.tid && O.cards.no === h.no) return;
    var blob = O.H[me], tag = T.tid + ':' + h.no + ':' + blob, tid = T.tid, no = h.no, pid = O.id.pid;
    if (O.cardsTry === tag) return;
    O.cardsTry = tag;
    HC.shared(O.key, O.dealerPk, 'cards|' + O.code).then(function (key) {
      return HC.open(key, blob, cardsLabel(tid, no, me, pid));
    }).then(function (b) {
      if (b && b.length === 2 && b[0] < 52 && b[1] < 52 && b[0] !== b[1]) { O.cards = { tid: tid, no: no, c: [b[0], b[1]] }; render(); }
    }, function () { O.cardsTry = ''; });
  }
  function myCards(T) {
    var h = T && T.hand;
    if (!h || !O.cards || O.cards.tid !== T.tid || O.cards.no !== h.no) return null;
    return O.cards.c;
  }

  function onTable(T) {
    if (!T) return;
    var h = T.hand, me = mySeat();
    if (O.pending && (!h || h.no !== O.pending.h || h.n !== O.pending.n)) O.pending = null;
    if (O.pre && (!h || me < 0)) O.pre = null;
    if (O.pre && h && me >= 0) {           // a choice made in advance only holds while it still means the same thing
      var toCall = Math.min(Math.max(0, h.cur - h.bet[me]), T.seats[me].stack);
      if (O.pre.key !== T.tid + ':' + h.no + ':' + h.street || h.fold[me] || h.allin[me] || h.done ||
        (O.pre.k === 'k' && toCall > 0) || (O.pre.k === 'c' && toCall !== O.pre.amt)) O.pre = null;
    }
    if (h && me >= 0 && h.actor === me && !h.next) {
      var key = T.tid + ':' + h.no + ':' + h.n;
      if (O.turnKey !== key) {
        O.turnKey = key; O.raiseOpen = false; O.raiseTo = 0; O.warned = {};

      '카드는 딜러 화면이 섞어서 나눠 줘요. 각자의 카드는 그 사람 기기에서만 풀리도록 암호화돼서 다른 참가자나 중계 서버는 볼 수 없어요. 딜러 화면은 숨겨진 카드를 화면에 표시하지 않아요.',
      'AI 플레이어는 딜러 화면에서 돌아가요(쉬움·보통·어려움). 자기 카드만 보고 판단하고, 사람이 모두 탈락하면 남은 AI끼리 빠르게 끝까지 진행해서 결과와 \'다시 하기\'가 곧 나와요.',
      '기록에서 핸드를 열면 테이블 리플레이(‹ › 로 한 단계씩)와 결정마다 GTO 근사 권장을 볼 수 있어요. 솔버 결과가 아니라 표준 레인지·푸시/폴드 표와 에퀴티·팟 오즈·MDF로 계산한 근사치예요.'
    ];
    return '<h2>규칙</h2><ul class="rules">' + li.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' +
      '<h2>상금 (머니인)</h2><table class="struct"><thead><tr><th>참가자</th><th>상금 받는 자리</th><th>나누는 비율</th></tr></thead><tbody>' +
      '<tr><td>2–4명</td><td>우승</td><td>100%</td></tr><tr><td>5–8명</td><td>2위까지</td><td>65 / 35%</td></tr><tr><td>9명</td><td>3위까지</td><td>50 / 30 / 20%</td></tr></tbody></table>' +
      '<p class="hint">참가비 = 시작 스택이라 상금 풀은 참가자 수 × 시작 스택이에요' + (T && T.pool ? ' (이번 판 ' + money(T.pool) + ': ' + prizeLine(T.prizes) + ')' : '') + '. 같은 핸드에서 같은 칩으로 함께 탈락하면 차지한 자리들의 상금을 똑같이 나눠요.</p>' +
      '<h2>블라인드 구조</h2><table class="struct"><thead><tr><th>레벨</th><th>블라인드</th><th>BB 앤티</th><th>시작</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<p class="hint">18레벨 이후에도 같은 흐름으로 계속 올라가요.</p>';
  }
  function menuHtml() {
    var T = curT(), me = mySeat();
    return '<h2>메뉴</h2><div class="menu">' +
      '<button class="mi' + (O.sound ? ' on' : '') + '" data-tog="sound">소리</button>' +
      '<button class="mi' + (O.four ? ' on' : '') + '" data-tog="four">4색 카드 (♦ 파랑 · ♣ 초록)</button>' +
      (!O.dealer && me >= 0 && T && T.st === 'run' ? '<button class="mi' + (O.away ? ' on' : '') + '" data-tog="away">자리 비움 — 내 차례에 자동 체크/폴드</button>' : '') +
      (!O.dealer && canLockLand() ? '<button class="mi" data-act="land">가로 모드 (전체 화면)</button>' : '') +
      '<button class="mi" data-act="copy">참가 링크 복사</button>' +
      (O.dealer && document.documentElement.requestFullscreen ? '<button class="mi" data-act="fullscreen">전체 화면</button>' : '') +
      '<button class="mi danger" data-act="leave">' + (O.leaveArmed && Date.now() - O.leaveArmed < 4000 ? '한 번 더 누르면 나가요' : (O.dealer ? '딜러 화면 닫기 (게임이 멈춰요)' : '방 나가기')) + '</button>' +
      '</div><p class="hint diag">' + esc(diagText()) + '</p>';
  }

  // ------------------------------------------------------------ clocks on screen
  function uiTick() {
    var now = Date.now(), T = curT(), off = offset(), scr = screen();
    if (O.rp && O.rp.play && RP && now - O.rp.play >= 1150) {
      if (O.rp.i >= RP.vs.length - 1) { O.rp.play = 0; render(); } else { O.rp.play = now; rpGo(O.rp.i + 1); }
    }
    if (scr === 'connecting' && now - O.connDrawn > 1000) { O.connDrawn = now; $('#overlay')._h = ''; render(); }
    if (!T) return;
    $$('[data-dl]').forEach(function (el) {
      var left = Math.max(0, +el.getAttribute('data-dl') - off - now), tot = +el.getAttribute('data-tot') || 30000;
      var frac = Math.max(0, Math.min(1, left / tot)), par = el.parentNode;
      if (el.classList.contains('rg')) {
        el.style.strokeDashoffset = (100 - frac * 100).toFixed(1);
        par.classList.toggle('low', left < 10000 && left >= 5000);
        par.classList.toggle('crit', left < 5000);
      } else if (el.classList.contains('bar-i')) {
        el.style.transform = 'scaleX(' + frac.toFixed(3) + ')';
        par.classList.toggle('low', left < 10000 && left >= 5000);
        par.classList.toggle('crit', left < 5000);
      } else el.textContent = String(Math.ceil(left / 1000));
    });
    $$('[data-lvl]').forEach(function (el) { el.textContent = mmss(+el.getAttribute('data-lvl') - off - now); });
    $$('[data-lvp]').forEach(function (el) {
      var ms = +el.getAttribute('data-lvms') || 1, left = +el.getAttribute('data-lvp') - off - now;
      el.style.width = (Math.max(0, Math.min(1, 1 - left / ms)) * 100).toFixed(1) + '%';
    });
    $$('[data-go]').forEach(function (el) { el.textContent = String(Math.max(0, Math.ceil((+el.getAttribute('data-go') - off - now) / 1000))); });
    var h = T.hand, me = mySeat();
    if (h && me >= 0 && h.actor === me && h.dl && !h.next) {
      var left = h.dl - off - now;
      if (left <= 10000 && left > 8500 && !O.warned[10]) { O.warned[10] = 1; beep(880, 0.08, 0.06); }
      if (left <= 5000 && left > 0 && !O.warned[5]) {
        O.warned[5] = 1; beep(988, 0.08, 0.07); beep(988, 0.08, 0.07, 0.16);
        if (navigator.vibrate) { try { navigator.vibrate([40, 60, 40]); } catch (e) { /* ignore */ } }
      }
    }
    if (O.pending && now - O.pending.at > 7000) { O.pending = null; toast('응답이 늦어요. 다시 눌러 주세요'); render(); }
    if (T.st === 'end' && !O.endShown && !O.endHidden && now > (T.endAt - off) + END_SHOW) { O.endShown = true; render(); }
  }

  // ------------------------------------------------------------ input
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(O.toastT);
    O.toastT = setTimeout(function () { el.classList.remove('on'); }, 2600);
  }
  function roomUrl() { return location.href.split('#')[0] + '#hd-' + O.code; }
  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement('textarea'), good = false;
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { good = document.execCommand('copy'); } catch (e) { good = false; }
      ta.remove();
      toast(good ? done : '복사하지 못했어요. 직접 선택해서 복사해 주세요');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(done); }, fallback);
    else fallback();
  }

  function pruneOld() {
    var now = Date.now(), i, k, v, drop = [];
    try {
      for (i = 0; i < localStorage.length; i++) {
        k = localStorage.key(i);
        if (k && k.indexOf('hd.host.') === 0) { v = LS.get(k, null); if (!v || !v.at || now - v.at > 3 * 86400000) drop.push(k); }
        if (k && k.indexOf('hd.ids.') === 0) { v = LS.get(k, []); if (!Array.isArray(v) || !v.length || now - (v[0].at || 0) > 14 * 86400000) drop.push(k); }
      }
    } catch (e) { /* ignore */ }
    drop.forEach(function (x) { LS.del(x); });
  }
  function createRoom() {
    if (O.busy) return;
    if (O.stackDraft) {
      var st = Math.floor(+O.stackDraft);
      if (!(st >= 20 && st <= 1000000)) { toast('시작 스택은 $20 ~ $1,000,000 사이로 정해 주세요'); return; }
      O.form.stack = st;
    }
    var cfg = validCfg(O.form), code = rid(6);
    O.busy = true; render();
    pruneOld();
    HC.newKey().then(function (k) {
      LS.set('hd.host.' + code, { cfg: cfg, S: null, round: 1, v: 0, joinAt: {}, last: null, at: Date.now(), jwk: k.jwk, made: Date.now() });
      LS.set('hd.cfg', cfg);
      SS.set('hd.sess.' + code, { pid: code });
      history.replaceState(null, '', '#hd-' + code);
      O.busy = false;
      enterRoom(code);
    }, function () { O.busy = false; O.unsupported = true; render(); });
  }

  function doAct(a, x) {
    var T = O.T, h = T && T.hand, me = mySeat();
    if (!h || me < 0 || h.actor !== me || (O.pending && O.pending.n === h.n && O.pending.h === h.no)) return;
    O.pending = { h: h.no, n: h.n, at: Date.now() };
    O.raiseOpen = false;
    render();
    sendReq({ k: 'act', h: h.no, n: h.n, a: a, x: x || 0 }).then(function (sent) { if (!sent) { O.pending = null; render(); } });
  }
  function doTimeCard() {
    var T = O.T, h = T && T.hand, me = mySeat();
    if (!h || me < 0 || h.actor !== me || T.seats[me].tc <= 0) return;
    var key = T.tid + ':' + h.no + ':' + h.n;
    O.tcUsed = O.tcKey === key ? O.tcUsed + 1 : h.tcu + 1;
    O.tcKey = key;
    O.warned = {};
    sendReq({ k: 'tc', h: h.no, n: h.n, c: O.tcUsed }).then(function (ok) { if (ok) toast('타임 카드를 썼어요 (+30초)'); });
  }
  function setAway(v) {
    O.away = v ? 1 : 0;
    publish();
    render();
    toast(O.away ? '자리 비움: 내 차례가 오면 자동으로 체크/폴드돼요' : '돌아왔어요');
  }

  function onClick(ev) {
    audio(); keepAwake();
    var t = ev.target.closest ? ev.target.closest('[data-act],[data-set],[data-amt],[data-hk],[data-tog]') : null;
    if (!t) return;
    if (t.hasAttribute('data-set')) {
      O.form[t.getAttribute('data-set')] = +t.getAttribute('data-v');
      if (t.getAttribute('data-set') === 'stack') O.stackDraft = '';
      render();
      return;
    }
    if (t.hasAttribute('data-amt')) { O.raiseTo = +t.getAttribute('data-amt'); render(); return; }
    if (t.hasAttribute('data-hk')) { var hk = t.getAttribute('data-hk'); O.histOpen = O.histOpen === hk ? '' : hk; render(); return; }
    if (t.hasAttribute('data-tog')) {
      var g = t.getAttribute('data-tog');
      if (g === 'sound') { O.sound = !O.sound; LS.set('hd.snd', O.sound); if (O.sound) { audio(); beep(660, 0.1, 0.07); } }
      else if (g === 'four') { O.four = !O.four; LS.set('hd.4c', O.four); }
      else if (g === 'away') { setAway(!O.away); return; }
      render();
      return;
    }
    var a = t.getAttribute('data-act'), T = curT(), h = T && T.hand;
    switch (a) {
      case 'create': createRoom(); break;
      case 'rules': case 'hist': case 'menu': O.sheet = a; O.leaveArmed = 0; render(); break;
      case 'closeSheet': O.sheet = ''; render(); break;
      case 'copy': copyText(roomUrl(), '참가 링크를 복사했어요'); break;
      case 'share':
        if (navigator.share) navigator.share({ title: '홀덤 토너먼트', text: '홀덤 토너먼트에 참가해요', url: roomUrl() }).catch(function () { /* cancelled */ });
        break;
      case 'home': location.href = location.href.split('#')[0]; break;
      case 'takeBack': takeBack(); break;
      case 'join': {
        var nick = cleanNick(O.nickDraft != null ? O.nickDraft : O.id.nick);
        if (!nick) { toast('닉네임을 적어 주세요'); var ni = $('#nickIn'); if (ni) ni.focus(); break; }
        O.id.nick = nick; O.nickDraft = null; O.want = 1; O.rdy = 0;
        LS.set('hd.nick', nick); saveSess(); saveId(); publish(); render();
        break;
      }
      case 'ready': if (T && T.st === 'lobby') { O.rdy = O.rdy === T.round ? 0 : T.round; publish(); render(); } break;
      case 'start': if (O.dealer && D.ready && !D.S) { D.startReq = true; dealerKick(); } break;
      case 'aiN': if (T && T.st === 'lobby') {
        var aw = aiWant(T), hum = T.lobby.filter(function (x) { return !x.bot; }).length;
        sendAi(Math.min(aw.n, MAX_SEATS - hum) + (+t.getAttribute('data-d') || 0), aw.lv);
      } break;
      case 'aiLv': if (T && T.st === 'lobby') sendAi(aiWant(T).n, +t.getAttribute('data-v') || 2); break;
      case 'leaveSeat': O.want = 0; O.rdy = 0; saveSess(); publish(); render(); break;
      case 'again':
        if (T && T.st === 'end') {
          O.want = 1; O.rdy = O.id.nick ? T.round + 1 : 0;
          saveSess(); publish();
          if (O.id.nick) toast('다음 토너먼트에 준비했어요');
          else { O.endHidden = true; O.endShown = false; toast('닉네임을 정하면 다음 토너먼트에 참가할 수 있어요'); render(); }
        }
        break;
      case 'hideEnd': O.endHidden = true; O.endShown = false; render(); break;
      case 'showEnd': O.endHidden = false; O.endShown = true; render(); break;
      case 'fold': doAct('f'); break;
      case 'check': doAct('k'); break;
      case 'call': doAct('c'); break;
      case 'raise': O.raiseOpen = !O.raiseOpen; render(); break;
      case 'raiseGo': {
        var L = h && HD.legal(h, T.seats, mySeat());
        if (L) doAct(O.raiseTo >= L.maxTo ? 'A' : 'r', O.raiseTo);
        break;
      }
      case 'tc': doTimeCard(); break;
      case 'pre': {
        var pk = t.getAttribute('data-pre'), me2 = mySeat();
        if (!h || me2 < 0) break;
        if (O.pre && O.pre.k === pk) O.pre = null;
        else O.pre = { k: pk, key: T.tid + ':' + h.no + ':' + h.street, amt: Math.min(Math.max(0, h.cur - h.bet[me2]), T.seats[me2].stack) };
        render();
        break;
      }
      case 'step': {
        var L2 = h && HD.legal(h, T.seats, mySeat());
        if (!L2) break;
        var stp = Math.max(1, h.bb), nv = (O.raiseTo || L2.minTo) + (+t.getAttribute('data-d') || 0) * stp;
        O.raiseTo = Math.max(L2.minTo, Math.min(L2.maxTo, nv));
        render();
        break;
      }
      case 'land': goLandscape(); break;
      case 'rotOk': O.rotOk = true; SS.set('hd.rotok', true); render(); break;
      case 'unmute': audio(); setTimeout(render, 120); break;
      case 'away': setAway(!O.away); break;
      case 'show': if (h && h.done) sendReq({ k: 'show', h: h.no }).then(function (ok) { if (ok) toast('카드를 보여 줬어요'); }); break;
      case 'export': download('holdem-' + O.code + '.txt', exportText()); break;
      case 'rpOpen': openReplay(t.getAttribute('data-rk')); break;
      case 'rpClose': closeReplay(); break;
      case 'rpFirst': if (O.rp) { O.rp.play = 0; O.rp.st.handKey = 'again'; O.rp.i = 1; rpGo(0); } break;
      case 'rpPrev': if (O.rp) { O.rp.play = 0; rpGo(O.rp.i - 1); } break;
      case 'rpNext': if (O.rp) { O.rp.play = 0; rpGo(O.rp.i + 1); } break;
      case 'rpLast': if (O.rp && RP) { O.rp.play = 0; rpGo(RP.vs.length - 1); } break;
      case 'rpPlay':
        if (O.rp && RP) {
          if (O.rp.play) O.rp.play = 0;
          else { if (O.rp.i >= RP.vs.length - 1) { O.rp.st.handKey = 'again'; O.rp.i = 0; } O.rp.play = Date.now(); }
          render();
        }
        break;
      case 'rpGo': if (O.rp) { O.rp.play = 0; rpGo(+t.getAttribute('data-v') || 0); } break;
      case 'rpSeat': if (O.rp) { O.rp.seat = +t.getAttribute('data-v'); $('#rtable')._sig = ''; render(); } break;
      case 'rpAll': if (O.rp) { O.rp.all = t.getAttribute('data-v') === '1'; render(); } break;
      case 'copyHist': copyText(exportText(), '기록을 복사했어요'); break;
      case 'fullscreen': try { document.documentElement.requestFullscreen(); } catch (e) { /* ignore */ } O.sheet = ''; render(); break;
      case 'leave':
        if (!O.leaveArmed || Date.now() - O.leaveArmed > 4000) { O.leaveArmed = Date.now(); render(); break; }
        if (!O.dealer) { O.want = 0; O.rdy = 0; saveSess(); publish(); }
        if (O.relay) { try { O.relay.leave(); } catch (e) { /* ignore */ } O.relay = null; }
        stopDealer();
        location.href = location.href.split('#')[0];
        break;
    }
  }
  function onInput(ev) {
    var t = ev.target;
    if (t.id === 'nickIn') O.nickDraft = t.value;
    else if (t.id === 'stackIn') {
      O.stackDraft = t.value.replace(/[^0-9]/g, '').slice(0, 7);
      if (t.value !== O.stackDraft) t.value = O.stackDraft;
      var st = +O.stackDraft;
      if (st >= 20 && st <= 1000000) { O.form.stack = st; render(); }
    } else if (t.id === 'rng' || t.id === 'ramt') {
      var T = O.T, h = T && T.hand, L = h && HD.legal(h, T.seats, mySeat());
      if (!L) return;
      var v = Math.floor(+String(t.value).replace(/[^0-9]/g, '')) || 0;
      if (t.id === 'rng') { O.raiseTo = v; var ra = $('#ramt'); if (ra) ra.value = v; }
      else {
        if (t.value !== String(v || '')) t.value = v || '';
        if (v >= L.minTo && v <= L.maxTo) { O.raiseTo = v; var rg = $('#rng'); if (rg) rg.value = v; }
      }
      var go = $('[data-act=raiseGo]');
      if (go && O.raiseTo >= L.minTo && O.raiseTo <= L.maxTo) go.textContent = raiseLabel(L, O.raiseTo);
      $$('.presets button').forEach(function (b) { b.classList.toggle('on', +b.getAttribute('data-amt') === O.raiseTo); });
    }
  }
  function onKey(ev) {
    if (O.rp && RP) {
      var k = ev.key;
      if (k === 'ArrowRight' || k === 'ArrowLeft' || k === 'Home' || k === 'End' || k === ' ' || k === 'Escape') ev.preventDefault();
      if (k === 'ArrowRight') { O.rp.play = 0; rpGo(O.rp.i + 1); }
      else if (k === 'ArrowLeft') { O.rp.play = 0; rpGo(O.rp.i - 1); }
      else if (k === 'Home') { O.rp.play = 0; rpGo(0); }
      else if (k === 'End') { O.rp.play = 0; rpGo(RP.vs.length - 1); }
      else if (k === ' ') { O.rp.play = O.rp.play ? 0 : Date.now(); render(); }
      else if (k === 'Escape') closeReplay();
      return;
    }
    if (ev.key === 'Escape' && O.sheet) { O.sheet = ''; render(); return; }
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'nickIn') { ev.preventDefault(); var b = $('[data-act=join]'); if (b) b.click(); }
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'ramt') { ev.preventDefault(); var g = $('[data-act=raiseGo]'); if (g) g.click(); }
  }

  function boot() {
    O.form = validCfg(LS.get('hd.cfg', CFG0));
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', onKey);
    window.addEventListener('resize', function () { $('#table')._sig = ''; var rt = $('#rtable'); if (rt) rt._sig = ''; render(); });
    if (window.ResizeObserver) { RO = new ResizeObserver(function () { render(); }); RO.observe($('#table')); }
    var sw = null;
    document.addEventListener('touchstart', function (ev) {
      var t = ev.touches[0];
      sw = O.rp && t && ev.target.closest && ev.target.closest('#rtable') ? { x: t.clientX, y: t.clientY } : null;
    }, { passive: true });
    document.addEventListener('touchend', function (ev) {
      var t = ev.changedTouches[0];
      if (!sw || !t || !O.rp) return;
      var dx = t.clientX - sw.x, dy = t.clientY - sw.y;
      sw = null;
      if (Math.abs(dx) > 45 && Math.abs(dy) < 60) { O.rp.play = 0; rpGo(O.rp.i + (dx < 0 ? 1 : -1)); }
    }, { passive: true });
    document.addEventListener('visibilitychange', function () { keepAwake(); if (O.dealer) dealerKick(); render(); });
    window.addEventListener('hashchange', function () { location.reload(); });
    setInterval(uiTick, 200);
    setInterval(maintain, 1000);
    var m = /^#hd-([a-z0-9]{6})$/.exec(location.hash);
    if (m) enterRoom(m[1]); else render();
  }

  if (DEBUG) window.__hd = { O: O, D: D, T: curT, me: mySeat, cards: function () { return myCards(curT()); }, hist: loadHist, exportText: exportText, replay: openReplay, histKey: histKey, render: render, draw: draw };
  boot();
})();

</script>
</body>
</html>
